version: '3.8'

# Ejemplo de docker-compose para producción con API backend

services:
  # API Backend (Ejemplo - reemplaza con tu backend real)
  qams-api:
    # image: your-registry/qams-api:latest
    # Descomentar la línea anterior y reemplazar con tu imagen
    build:
      context: ../qams-api  # Ruta relativa al backend
      dockerfile: Dockerfile
    container_name: qams-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/qams
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qams-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: qams-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=qams
    volumes:
      - db-data:/var/lib/postgresql/data
      # Descomenta la siguiente línea para ejecutar scripts de inicialización
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - qams-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Web
  qams-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qams-web
    ports:
      - "80:80"
      # Descomentar para HTTPS
      # - "443:443"
    environment:
      - NODE_ENV=production
      - API_URL=http://qams-api:3000
    depends_on:
      - qams-api
    restart: unless-stopped
    networks:
      - qams-network
    # Volumen para certificados SSL (si se usa HTTPS)
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis para caché (Opcional)
  redis:
    image: redis:7-alpine
    container_name: qams-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - qams-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (Opcional - si quieres múltiples servicios tras un único proxy)
  # proxy:
  #   image: nginx:alpine
  #   container_name: qams-proxy
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - qams-web
  #     - qams-api
  #   restart: unless-stopped
  #   networks:
  #     - qams-network

# Volúmenes persistentes
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local

# Red de comunicación entre servicios
networks:
  qams-network:
    driver: bridge
