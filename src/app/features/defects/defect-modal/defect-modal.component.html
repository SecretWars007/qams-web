<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 animate-fade-in">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden animate-slide-up border border-gray-100 flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ isEdit ? 'Editar Defecto' : 'Reportar Defecto' }}
      </h2>
      <button type="button" (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors p-2 rounded-lg hover:bg-gray-100">
        <i class="ri-close-line text-xl"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto flex-1">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6" id="defect-form">
        
        <!-- Título -->
        <div class="form-group">
          <label class="form-label" for="title">Título del Defecto <span class="text-red-500">*</span></label>
          <input type="text" id="title" formControlName="title" class="form-control" placeholder="Ej: Error 500 al procesar pago con tarjeta Visa">
          <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-red-500 text-xs mt-1">
            Requerido (mínimo 5 caracteres).
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Priority -->
          <div class="form-group">
            <label class="form-label" for="priorityId">Prioridad</label>
            <select id="priorityId" formControlName="priorityId" class="form-control">
              <option *ngFor="let p of priorities" [value]="p.id">{{ p.name }}</option>
            </select>
          </div>

          <!-- Severity -->
          <div class="form-group">
            <label class="form-label" for="severityId">Severidad</label>
            <select id="severityId" formControlName="severityId" class="form-control">
              <option *ngFor="let s of severities" [value]="s.id">{{ s.name }}</option>
            </select>
          </div>

          <!-- Status -->
          <div class="form-group" *ngIf="isEdit">
            <label class="form-label" for="statusId">Estado</label>
            <select id="statusId" formControlName="statusId" class="form-control">
              <option *ngFor="let s of statuses" [value]="s.id">{{ s.name }}</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label" for="description">Descripción general</label>
          <textarea id="description" formControlName="description" class="form-control" rows="2" placeholder="Resumen del problema encontrado..."></textarea>
        </div>

        <!-- Steps to Reproduce -->
        <div class="form-group">
          <label class="form-label" for="stepsToReproduce">Pasos para Reproducir</label>
          <textarea id="stepsToReproduce" formControlName="stepsToReproduce" class="form-control" rows="3" placeholder="1. Ir a la pantalla de login&#10;2. Ingresar credenciales inválidas&#10;3. Observar error 500"></textarea>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3">
      <button type="button" (click)="close.emit()" class="btn-secondary">Cancelar</button>
      <button type="submit" form="defect-form" [disabled]="form.invalid" class="btn-primary">
        {{ isEdit ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
