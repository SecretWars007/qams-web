<div class="space-y-6">
  <!-- Header Component -->
  <app-test-plans-header 
    [projects]="filteredProjects()" 
    [suts]="suts()" 
    [activeProjectId]="activeProjectId()" 
    [activeSutId]="activeSutId()"
    [activeProject]="activeProject()" 
    [searchTerm]="searchTerm()"
    (sutSelect)="onSutSelect($event)" 
    (projectSelect)="onProjectSelect($event)"
    (searchChange)="searchTerm.set($event)"
    (createPlan)="openCreateModal()">
  </app-test-plans-header>

  <!-- Loading State -->
  <div *ngIf="loading()" class="grid gap-4 mt-6 animate-pulse">
    <div class="h-16 bg-white/40 rounded-xl border border-white/20"></div>
    <div class="h-16 bg-white/40 rounded-xl border border-white/20"></div>
    <div class="h-16 bg-white/40 rounded-xl border border-white/20"></div>
  </div>

  <!-- Content -->
  <div *ngIf="!loading()">
    <!-- Empty State -->
    @if (filteredTestPlans().length === 0) {
      <app-test-plans-empty></app-test-plans-empty>
    } @else {
      <!-- Table Component -->
      <app-test-plans-table 
        [testPlans]="filteredTestPlans()"
        [loading]="loading()"
        (viewPlan)="openDetailModal($event)"
        (editPlan)="openEditModal($event)"
        (approvePlan)="approvePlan($event)"
        (downloadReport)="downloadReport($event)"
        (deletePlan)="deletePlan($event)">
      </app-test-plans-table>
    }
  </div>

  <!-- Modal Component -->
  <app-test-plan-modal 
    *ngIf="showModal()" 
    [isEdit]="isEdit()" 
    [plan]="selectedPlan()" 
    [projectId]="currentProjectId"
    [projects]="projects()"
    (closeModal)="closeModal()" 
    (savePlan)="onSave($event)">
  </app-test-plan-modal>

  <app-test-plan-detail 
    *ngIf="showDetail() && selectedPlan()" 
    [plan]="selectedPlan()!" 
    (closeDetail)="closeDetail()">
  </app-test-plan-detail>
</div>
