<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-[#111E30] p-6 rounded-2xl border border-emerald-500/15 backdrop-blur-md shadow-sm transition-all duration-300 text-slate-100">
  <div>
    <div class="flex items-center gap-2 mb-1 flex-wrap">
      <h1 class="text-2xl font-bold text-slate-100 tracking-tight flex items-center gap-2">
        <i class="ri-file-list-3-line text-emerald-400"></i> Planes de Prueba ISTQB
      </h1>
      <span class="px-2 py-0.5 rounded-md text-[10px] font-mono font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">ISO/IEC/IEEE 29119-3</span>

      <!-- SUT Filter Dropdown -->
      <div class="relative ml-2 mt-2 sm:mt-0">
        <label for="testPlansSutSelect" class="sr-only">Filtrar por SUT</label>
        <select id="testPlansSutSelect" [ngModel]="activeSutId" (ngModelChange)="onSutChange($event)"
          class="pl-10 pr-8 py-2 bg-slate-900/60 border border-emerald-500/20 rounded-xl text-xs font-semibold text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400 appearance-none shadow-sm min-w-[200px] transition-colors cursor-pointer">
          <option [value]="null" class="bg-slate-900">Filtrar por SUT (Todos)</option>
          @for (s of suts; track s.id) {
            <option [value]="s.id" class="bg-slate-900">{{ s.name }}</option>
          }
        </select>
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400 text-sm">
          <i class="ri-server-line"></i>
        </div>
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-base">
          <i class="ri-arrow-down-s-line"></i>
        </div>
      </div>

      <!-- Project Filter Dropdown -->
      <div class="relative ml-2 mt-2 sm:mt-0">
        <label for="testPlansProjectSelect" class="sr-only">Filtrar por proyecto</label>
        <select id="testPlansProjectSelect" [ngModel]="activeProjectId" (ngModelChange)="onProjectChange($event)"
          class="pl-10 pr-8 py-2 bg-slate-900/60 border border-emerald-500/20 rounded-xl text-xs font-semibold text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400 appearance-none shadow-sm min-w-[200px] transition-colors cursor-pointer">
          <option [value]="null" class="bg-slate-900">Filtrar por proyecto (Todos)</option>
          @for (p of projects; track p.id) {
            <option [value]="p.id" class="bg-slate-900">{{ p.name }}</option>
          }
        </select>
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400 text-sm">
          <i class="ri-folder-shared-line"></i>
        </div>
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-base">
          <i class="ri-arrow-down-s-line"></i>
        </div>
      </div>
    </div>
    @if (activeProject) {
      <p class="text-slate-400 text-xs mt-1 animate-fade-in">
        Gestionando planes para <span class="text-emerald-400 font-bold">{{ activeProject.name }}</span>.
      </p>
    } @else {
      <p class="text-slate-400 text-xs mt-1 animate-fade-in">Estrategia, alcance, análisis de riesgo y Criterios de Entrada/Salida (Entry &amp; Exit Criteria).</p>
    }
  </div>
  
  <div class="flex items-center gap-3 w-full sm:w-auto">
    <!-- Search Bar -->
    <div class="relative flex-1 sm:w-64">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
        <i class="ri-search-line"></i>
      </div>
      <input type="text" [ngModel]="searchTerm" (ngModelChange)="onSearchChange($event)"
        class="block w-full pl-10 pr-3 py-2 bg-slate-900/60 border border-emerald-500/20 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400 shadow-sm transition-all"
        placeholder="Buscar planes de prueba..." />
    </div>

    <!-- Create Button -->
    <button (click)="onCreateClick()" class="btn-primary whitespace-nowrap flex items-center gap-2">
      <i class="ri-add-circle-line"></i>
      <span>Nuevo Plan</span>
    </button>
  </div>
</div>
