<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 animate-fade-in">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-slide-up border border-gray-100 flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-semibold text-gray-800">Generar Nueva API Key</h2>
      <button type="button" (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors p-2 rounded-lg hover:bg-gray-100">
        <i class="ri-close-line text-xl"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto flex-1">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" id="api-key-form">
        <!-- Name -->
        <div class="form-group">
          <label class="form-label" for="name">Nombre / Propósito</label>
          <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ej: Jenkins CI, Automatización E2E">
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-xs mt-1">
            El nombre es requerido (min 3 caracteres)
          </div>
        </div>

        <!-- Project ID (oculto temporalmente o solo lectura, en un caso real se elegiría) -->
        <input type="hidden" formControlName="projectId">

        <!-- Expires At -->
        <div class="form-group">
          <label class="form-label" for="expiresAt">Fecha de Expiración (Opcional)</label>
          <input type="date" id="expiresAt" formControlName="expiresAt" class="form-control">
          <p class="text-xs text-gray-500 mt-1">Si se deja vacío, la clave nunca expirará.</p>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3">
      <button type="button" (click)="close.emit()" class="btn-secondary">Cancelar</button>
      <button type="submit" form="api-key-form" [disabled]="form.invalid" class="btn-primary">
        Generar Token
      </button>
    </div>
  </div>
</div>
