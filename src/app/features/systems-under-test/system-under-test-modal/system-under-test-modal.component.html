<!-- Modal SUT - Unified Dark Emerald Theme -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4 animate-fade-in">
  <div class="bg-[#0E1A2B] rounded-2xl shadow-2xl shadow-emerald-950/50 w-full max-w-2xl overflow-hidden border border-emerald-500/20 flex flex-col max-h-[90vh] animate-slide-up">

    <!-- Header del Modal -->
    <div class="px-6 py-4 border-b border-emerald-500/15 flex justify-between items-center bg-slate-900/60">
      <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/15 border border-emerald-500/30">
          <i class="ri-server-line text-emerald-400 text-base"></i>
        </span>
        {{ isEdit ? 'Editar Sistema Bajo Prueba' : 'Nuevo Sistema Bajo Prueba' }}
      </h2>
      <button type="button" (click)="closeModal.emit()"
              class="text-slate-400 hover:text-slate-100 transition-colors p-2 rounded-lg hover:bg-slate-700/60">
        <i class="ri-close-line text-xl"></i>
      </button>
    </div>

    <!-- Body del Modal -->
    <div class="p-6 overflow-y-auto flex-1">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" id="sut-form">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <!-- Nombre del Sistema -->
          <div class="form-group md:col-span-2">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="name">
              Nombre del Sistema <span class="text-red-400">*</span>
            </label>
            <input type="text" id="name" formControlName="name"
                   class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 placeholder-slate-500
                          rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50
                          focus:border-emerald-400 transition-all"
                   placeholder="Ej: Portal de Clientes, API de Pagos">
            <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
                 class="text-red-400 text-xs mt-1.5 flex items-center gap-1">
              <i class="ri-error-warning-line"></i> El nombre es requerido (mínimo 3 caracteres).
            </div>
          </div>

          <!-- Tipo de Plataforma -->
          <div class="form-group">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="platformTypeId">
              Tipo de Plataforma <span class="text-red-400">*</span>
            </label>
            <select id="platformTypeId" formControlName="platformTypeId"
                    class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 rounded-xl px-4 py-2.5
                           text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400
                           transition-all appearance-none cursor-pointer">
              <option *ngFor="let type of platformTypes()" [value]="type.id" class="bg-slate-900">{{ type.name }}</option>
            </select>
          </div>

          <!-- Versión -->
          <div class="form-group">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="version">
              Versión <span class="text-red-400">*</span>
            </label>
            <input type="text" id="version" formControlName="version"
                   class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 placeholder-slate-500
                          rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50
                          focus:border-emerald-400 transition-all"
                   placeholder="Ej: 1.0.0, v2.4-beta">
          </div>

          <!-- Entorno -->
          <div class="form-group">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="environment">
              Entorno
            </label>
            <select id="environment" formControlName="environment"
                    class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 rounded-xl px-4 py-2.5
                           text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400
                           transition-all appearance-none cursor-pointer">
              <option *ngFor="let env of environments" [value]="env" class="bg-slate-900">{{ env }}</option>
            </select>
          </div>

          <!-- Campos condicionales según Tipo de Plataforma -->

          <!-- Web SUT: URL -->
          <div class="form-group" *ngIf="selectedPlatformCode === 'WEB'">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="baseUrl">
              URL de Acceso <span class="text-red-400">*</span>
            </label>
            <input type="url" id="baseUrl" formControlName="baseUrl"
                   class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 placeholder-slate-500
                          rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50
                          focus:border-emerald-400 transition-all"
                   placeholder="https://...">
            <div *ngIf="form.get('baseUrl')?.invalid && form.get('baseUrl')?.touched"
                 class="text-red-400 text-xs mt-1.5 flex items-center gap-1">
              <i class="ri-error-warning-line"></i> Debe ser una URL válida (http/https).
            </div>
          </div>

          <!-- Desktop SUT: Ruta ejecutable, proceso y URL opcional -->
          <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-violet-500/[0.04] rounded-xl border border-violet-500/20"
               *ngIf="selectedPlatformCode === 'DESKTOP'">
            <div class="form-group">
              <label class="block text-xs font-semibold text-violet-400 uppercase tracking-wider mb-1.5" for="executablePath">
                Ruta del Ejecutable <span class="text-red-400">*</span>
              </label>
              <input type="text" id="executablePath" formControlName="executablePath"
                     class="w-full bg-slate-900/60 border border-violet-500/20 text-slate-100 placeholder-slate-500
                            rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50
                            focus:border-violet-400 transition-all"
                     placeholder="Ej: C:\Program Files\App\app.exe">
            </div>
            <div class="form-group">
              <label class="block text-xs font-semibold text-violet-400 uppercase tracking-wider mb-1.5" for="processName">
                Nombre del Proceso <span class="text-red-400">*</span>
              </label>
              <input type="text" id="processName" formControlName="processName"
                     class="w-full bg-slate-900/60 border border-violet-500/20 text-slate-100 placeholder-slate-500
                            rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50
                            focus:border-violet-400 transition-all"
                     placeholder="Ej: app.exe">
            </div>
            <div class="form-group md:col-span-2">
              <label class="block text-xs font-semibold text-violet-400 uppercase tracking-wider mb-1.5" for="baseUrlDesktop">
                URL del Servidor / API <span class="text-slate-500 font-normal normal-case">(Opcional)</span>
              </label>
              <input type="url" id="baseUrlDesktop" formControlName="baseUrl"
                     class="w-full bg-slate-900/60 border border-violet-500/20 text-slate-100 placeholder-slate-500
                            rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50
                            focus:border-violet-400 transition-all"
                     placeholder="https://api.servidor.com">
            </div>
          </div>

          <!-- Data Processing SUT: Endpoint URL -->
          <div class="form-group" *ngIf="selectedPlatformCode === 'DATA_PROCESSING'">
            <label class="block text-xs font-semibold text-amber-400 uppercase tracking-wider mb-1.5" for="baseUrlData">
              Endpoint / URL de Servicio
            </label>
            <input type="url" id="baseUrlData" formControlName="baseUrl"
                   class="w-full bg-slate-900/60 border border-amber-500/20 text-slate-100 placeholder-slate-500
                          rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50
                          focus:border-amber-400 transition-all"
                   placeholder="https://api.procesamiento.com">
            <div *ngIf="form.get('baseUrl')?.invalid && form.get('baseUrl')?.touched"
                 class="text-red-400 text-xs mt-1.5 flex items-center gap-1">
              <i class="ri-error-warning-line"></i> Debe ser una URL válida.
            </div>
          </div>

          <!-- Descripción -->
          <div class="form-group md:col-span-2">
            <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1.5" for="description">
              Descripción
            </label>
            <textarea id="description" formControlName="description" rows="3"
                      class="w-full bg-slate-900/60 border border-emerald-500/20 text-slate-100 placeholder-slate-500
                             rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50
                             focus:border-emerald-400 transition-all resize-none"
                      placeholder="Breve descripción del sistema..."></textarea>
          </div>

          <!-- Estado activo (Toggle) -->
          <div class="form-group md:col-span-2">
            <label class="flex items-center gap-3 cursor-pointer group w-fit">
              <div class="relative">
                <input type="checkbox" formControlName="isActive" class="sr-only peer">
                <div class="w-11 h-6 bg-slate-700 rounded-full peer
                            peer-checked:bg-emerald-500
                            after:content-[''] after:absolute after:top-0.5 after:left-0.5
                            after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all
                            peer-checked:after:translate-x-5
                            ring-1 ring-slate-600 peer-checked:ring-emerald-500/50">
                </div>
              </div>
              <span class="text-sm font-semibold text-slate-300 group-hover:text-slate-100 transition-colors">
                Sistema Activo
              </span>
            </label>
          </div>

        </div>
      </form>
    </div>

    <!-- Footer del Modal -->
    <div class="px-6 py-4 border-t border-emerald-500/15 bg-slate-900/40 flex justify-end gap-3">
      <button type="button" (click)="closeModal.emit()" class="btn-secondary">
        Cancelar
      </button>
      <button type="submit" form="sut-form" [disabled]="form.invalid" class="btn-primary">
        <i class="ri-save-line mr-1.5"></i>
        {{ isEdit ? 'Actualizar SUT' : 'Guardar SUT' }}
      </button>
    </div>
  </div>
</div>
