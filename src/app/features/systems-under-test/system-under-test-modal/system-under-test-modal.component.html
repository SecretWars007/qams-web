<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4 animate-fade-in">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden animate-slide-up border border-gray-100 flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ isEdit ? 'Editar Sistema Bajo Prueba' : 'Nuevo Sistema Bajo Prueba' }}
      </h2>
      <button type="button" (click)="closeModal.emit()" class="text-gray-400 hover:text-gray-600 transition-colors p-2 rounded-lg hover:bg-gray-100">
        <i class="ri-close-line text-xl"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto flex-1">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" id="sut-form">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Name -->
          <div class="form-group md:col-span-2">
            <label class="form-label" for="name">Nombre del Sistema <span class="text-red-500">*</span></label>
            <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ej: Portal de Clientes, API de Pagos">
            <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-xs mt-1">
              El nombre es requerido (mínimo 3 caracteres).
            </div>
          </div>

          <!-- Platform Type -->
          <div class="form-group">
            <label class="form-label" for="platformTypeId">Tipo de Plataforma <span class="text-red-500">*</span></label>
            <select id="platformTypeId" formControlName="platformTypeId" class="form-control">
              <option *ngFor="let type of platformTypes()" [value]="type.id">{{ type.name }}</option>
            </select>
          </div>

          <!-- Version -->
          <div class="form-group">
            <label class="form-label" for="version">Versión <span class="text-red-500">*</span></label>
            <input type="text" id="version" formControlName="version" class="form-control" placeholder="Ej: 1.0.0, v2.4-beta">
          </div>

          <!-- Environment -->
          <div class="form-group">
            <label class="form-label" for="environment">Entorno</label>
            <select id="environment" formControlName="environment" class="form-control">
              <option *ngFor="let env of environments" [value]="env">{{ env }}</option>
            </select>
          </div>

          <!-- Conditional Fields based on Platform Type -->
          <!-- Web SUT: URL only -->
          <div class="form-group" *ngIf="selectedPlatformCode === 'WEB'">
            <label class="form-label" for="baseUrl">URL de Acceso <span class="text-red-500">*</span></label>
            <input type="url" id="baseUrl" formControlName="baseUrl" class="form-control" placeholder="https://...">
            <div *ngIf="form.get('baseUrl')?.invalid && form.get('baseUrl')?.touched" class="text-red-500 text-xs mt-1">
              Debe ser una URL válida (http/https).
            </div>
          </div>

          <!-- Desktop SUT: Executable Path & Process Name & Optional Server URL -->
          <div class="form-group md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-5 p-4 bg-gray-50 rounded-xl border border-gray-100" *ngIf="selectedPlatformCode === 'DESKTOP'">
            <div class="form-group">
              <label class="form-label" for="executablePath">Ruta del Ejecutable <span class="text-red-500">*</span></label>
              <input type="text" id="executablePath" formControlName="executablePath" class="form-control" placeholder="Ej: C:\Program Files\App\app.exe">
            </div>
            <div class="form-group">
              <label class="form-label" for="processName">Nombre del Proceso <span class="text-red-500">*</span></label>
              <input type="text" id="processName" formControlName="processName" class="form-control" placeholder="Ej: app.exe">
            </div>
            <div class="form-group md:col-span-2">
              <label class="form-label" for="baseUrl">URL del Servidor / API (Opcional)</label>
              <input type="url" id="baseUrl" formControlName="baseUrl" class="form-control" placeholder="https://api.servidor.com">
            </div>
          </div>

          <!-- Data Processing SUT: Endpoint URL only -->
          <div class="form-group" *ngIf="selectedPlatformCode === 'DATA_PROCESSING'">
            <label class="form-label" for="baseUrl">Endpoint / URL de Servicio</label>
            <input type="url" id="baseUrl" formControlName="baseUrl" class="form-control" placeholder="https://api.procesamiento.com">
            <div *ngIf="form.get('baseUrl')?.invalid && form.get('baseUrl')?.touched" class="text-red-500 text-xs mt-1">
              Debe ser una URL válida.
            </div>
          </div>

          <!-- Description -->
          <div class="form-group md:col-span-2">
            <label class="form-label" for="description">Descripción</label>
            <textarea id="description" formControlName="description" class="form-control" rows="3" placeholder="Breve descripción del sistema..."></textarea>
          </div>

          <!-- Is Active -->
          <div class="form-group md:col-span-2 flex items-center gap-3">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" formControlName="isActive" class="sr-only peer">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-600"></div>
              <span class="ml-3 text-sm font-medium text-gray-700">Sistema Activo</span>
            </label>
          </div>

        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3">
      <button type="button" (click)="closeModal.emit()" class="btn-secondary">Cancelar</button>
      <button type="submit" form="sut-form" [disabled]="form.invalid" class="btn-primary">
        {{ isEdit ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
