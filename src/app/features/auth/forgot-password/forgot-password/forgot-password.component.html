<!-- Diseño de Recuperación con Pantalla Dividida (Split Screen) -->
<div class="flex flex-col lg:flex-row items-stretch justify-center gap-0 bg-white/95 backdrop-blur-xl border border-indigo-500/10 shadow-2xl shadow-indigo-500/10 rounded-[2rem] overflow-hidden w-full max-w-4xl mx-auto animate-scale-in">
  
  <!-- LADO IZQUIERDO: Branding (Marca) -->
  <div class="lg:w-[350px] bg-gradient-to-br from-indigo-600 via-[#150fbd] to-indigo-900 p-12 flex flex-col items-center justify-center text-center relative overflow-hidden">
    <!-- Decoración de fondo -->
    <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-32 -mt-32"></div>
    <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-400/20 rounded-full blur-3xl -ml-32 -mb-32"></div>
    
    <div class="relative z-10">
      <div class="inline-flex items-center justify-center w-24 h-24 bg-white rounded-[2rem] mb-6 shadow-2xl overflow-hidden animate-float">
        <img src="/images/logo.png" alt="QAMS logo" class="w-full h-full object-cover" />
      </div>
      <h1 class="text-3xl font-black text-white tracking-tight mb-2">QAMS</h1>
      <div class="h-1 w-10 bg-white/20 mx-auto mb-4 rounded-full"></div>
      <p class="text-indigo-100 text-[10px] font-bold tracking-[0.3em] leading-relaxed max-w-[180px] mx-auto">
        Quality Assurance Management System
      </p>
    </div>
  </div>

  <!-- LADO DERECHO: Formulario -->
  <div class="flex-1 p-8 lg:p-12 bg-white relative">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#150fbd] to-transparent opacity-10"></div>
    
    <header class="mb-8">
      <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-2">
        Recuperar Contraseña
      </h2>
      <p class="text-slate-500 text-sm font-medium">Ingresa tu correo para recibir instrucciones</p>
    </header>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div class="flex flex-col gap-2">
        <label for="forgotEmail" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Correo electrónico</label>
        <div class="relative flex items-center group">
          <i class="fas fa-envelope absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
          <input id="forgotEmail" type="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
            [(ngModel)]="email" name="email" #emailModel="ngModel" placeholder="ejemplo@correo.com"
            required email autofocus />
        </div>
        <div *ngIf="emailModel.touched && emailModel.invalid" class="text-rose-500 text-[10px] font-bold mt-1 ml-1">
          Ingrese un correo electrónico válido
        </div>
      </div>

      <!-- Botón Enviar -->
      <button type="submit" 
        class="w-full bg-[#150fbd] hover:bg-indigo-700 text-white font-black py-4 rounded-xl transition-all shadow-xl shadow-indigo-500/20 active:scale-[0.98] mt-6 flex items-center justify-center gap-3 tracking-widest text-sm group"
        [disabled]="loading()">
        @if (loading()) {
          <i class="fas fa-spinner animate-spin"></i>
          <span>Enviando...</span>
        } @else {
          <span>Enviar instrucciones</span>
          <i class="fas fa-paper-plane text-base transition-transform group-hover:translate-x-1"></i>
        }
      </button>
    </form>

    <!-- Footer del Formulario -->
    <div class="pt-8 border-t border-slate-100 mt-8 text-center">
      <p class="text-sm font-medium text-slate-500">
        <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-700 transition-colors font-black underline underline-offset-4 decoration-2">
          Volver al inicio de sesión
        </a>
      </p>
    </div>
  </div>
</div>
