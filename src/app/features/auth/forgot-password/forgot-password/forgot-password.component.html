<div class="bg-white border border-slate-200 rounded-[2rem] p-8 shadow-[0_20px_50px_-10px_rgba(15,23,42,0.1)] flex flex-col relative overflow-hidden">
  <h2 class="text-3xl font-black text-slate-900 text-center mb-4 tracking-tight">
    Recuperar Contraseña
  </h2>

  <p class="text-sm text-slate-500 mb-8 text-center leading-relaxed font-medium">
    Ingrese su correo electrónico y le enviaremos instrucciones para restablecer su contraseña.
  </p>

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Email -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-600 uppercase tracking-widest ml-1">Correo Electrónico</label>
      <div class="relative flex items-center group">
        <i class="fas fa-envelope absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="email" class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="email" name="email" #emailModel="ngModel" placeholder="ejemplo@correo.com"
          required email autofocus />
      </div>
      <div *ngIf="emailModel.touched && emailModel.invalid" class="text-rose-500 text-[10px] font-bold uppercase mt-1 ml-1">
        Ingrese un correo electrónico válido
      </div>
    </div>

    <!-- Botón Enviar -->
    <button type="submit" 
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-[0.98] mt-4 flex items-center justify-center gap-2"
      [disabled]="loading()">
      @if (loading()) {
      <svg class="animate-spin w-5 h-5 opacity-75" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
      </svg>
      <span>Enviando...</span>
      } @else {
      <span>Enviar Instrucciones</span>
      <i class="fas fa-paper-plane ml-1"></i>
      }
    </button>
  </form>

  <!-- Link a login -->
  <p class="mt-8 text-center text-sm font-medium text-slate-500">
    <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-500 transition-colors ml-1 border-b border-indigo-600/30 hover:border-indigo-500 pb-0.5 font-bold">
      Volver al inicio de sesión
    </a>
  </p>
</div>
