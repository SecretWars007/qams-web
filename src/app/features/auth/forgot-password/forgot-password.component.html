<!-- Diseño de Recuperación con Pantalla Dividida (Split Screen) - Unified Green Theme -->
<div class="flex flex-col lg:flex-row items-stretch justify-center gap-0 bg-[#111E30]/95 backdrop-blur-2xl border border-emerald-500/20 shadow-2xl shadow-emerald-950/40 rounded-[2rem] overflow-hidden w-full max-w-4xl mx-auto animate-scale-in text-slate-100">
  
  <!-- LADO IZQUIERDO: Branding (Marca) -->
  <div class="lg:w-[350px] bg-gradient-to-br from-emerald-600 via-[#064E3B] to-[#0A1320] p-12 flex flex-col items-center justify-center text-center relative overflow-hidden">
    <!-- Decoración de fondo -->
    <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-400/10 rounded-full blur-3xl -mr-32 -mt-32"></div>
    <div class="absolute bottom-0 left-0 w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl -ml-32 -mb-32"></div>
    
    <div class="relative z-10 flex flex-col items-center">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-slate-900/80 border border-emerald-500/30 rounded-3xl mb-5 shadow-2xl shadow-emerald-500/20">
        <i class="fas fa-shield-alt text-emerald-400 text-3xl"></i>
      </div>
      <h1 class="text-3xl font-black text-white tracking-tight mb-1">QAMS</h1>
      <div class="h-1 w-10 bg-emerald-400/40 mx-auto mb-3 rounded-full"></div>
      <p class="text-emerald-300 text-[10px] font-black tracking-[0.25em] leading-relaxed max-w-[180px] mx-auto uppercase">
        Recuperación Segura
      </p>
    </div>
  </div>

  <!-- LADO DERECHO: Formulario -->
  <div class="flex-1 p-8 lg:p-12 bg-[#111E30] relative border-l border-emerald-500/10">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-30"></div>
    
    <header class="mb-8">
      <h2 class="text-2xl lg:text-3xl font-black text-slate-100 tracking-tight mb-2">
        Recuperar Contraseña
      </h2>
      <p class="text-slate-400 text-sm font-medium">Ingresa tu correo para recibir las instrucciones de restablecimiento</p>
    </header>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <label for="forgotEmail" class="text-[11px] font-black text-emerald-400/90 tracking-widest ml-1 uppercase">Correo electrónico</label>
        <div class="relative flex items-center group">
          <i class="fas fa-envelope absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
          <input id="forgotEmail" type="email" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-xl py-3.5 pl-12 pr-4 text-sm text-slate-100 placeholder:text-slate-500 focus:bg-slate-900 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none" 
            [(ngModel)]="email" name="email" #emailModel="ngModel" placeholder="ejemplo@correo.com"
            required email autofocus />
        </div>
        <div *ngIf="emailModel.touched && emailModel.invalid" class="text-rose-400 text-[10px] font-bold mt-1 ml-1">
          Ingrese un correo electrónico válido
        </div>
      </div>

      <!-- Botón Enviar -->
      <button type="submit" 
        class="w-full bg-gradient-to-r from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 text-white font-black py-4 rounded-xl transition-all shadow-xl shadow-emerald-500/20 active:scale-[0.98] mt-6 flex items-center justify-center gap-3 tracking-widest text-sm group"
        [disabled]="loading()">
        @if (loading()) {
          <i class="fas fa-spinner animate-spin text-base"></i>
          <span>Enviando...</span>
        } @else {
          <span>Enviar instrucciones</span>
          <i class="fas fa-paper-plane text-base transition-transform group-hover:translate-x-1"></i>
        }
      </button>
    </form>

    <!-- Footer del Formulario -->
    <div class="pt-6 border-t border-emerald-500/10 mt-6 text-center">
      <p class="text-sm font-medium text-slate-400">
        <a routerLink="/auth/login" class="text-emerald-400 hover:text-emerald-300 transition-colors font-black underline underline-offset-4 decoration-2">
          Volver al inicio de sesión
        </a>
      </p>
    </div>
  </div>
</div>
