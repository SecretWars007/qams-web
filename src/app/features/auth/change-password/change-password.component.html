<div class="p-6 max-w-3xl mx-auto mt-4 text-slate-100">
  <div class="mb-8">
    <h1 class="text-3xl font-black text-slate-100 tracking-tight">Cambiar Contraseña</h1>
    <p class="text-slate-400 mt-2 text-sm font-medium">
      Actualiza tu contraseña de acceso al sistema regularmente para mantener la seguridad de tus credenciales QA.
    </p>
  </div>

  <div class="bg-[#111E30] rounded-3xl shadow-xl shadow-black/40 border border-emerald-500/20 overflow-hidden relative">
    <!-- Decorative subtle gradient -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-teal-500"></div>
    
    <div class="p-8">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Contraseña Actual -->
        <div class="flex flex-col gap-2">
          <label for="currentPassword" class="text-xs font-bold text-emerald-400/90 tracking-widest ml-1 uppercase">Contraseña actual *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-unlock-alt absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
            <input id="currentPassword" [type]="showCurrentPassword ? 'text' : 'password'" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-2xl py-3 pl-12 pr-12 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
              [(ngModel)]="form.currentPassword" name="currentPassword"
              placeholder="Ingrese su contraseña actual" required />
            <button type="button" (click)="showCurrentPassword = !showCurrentPassword" class="absolute right-4 text-slate-500 hover:text-emerald-400 transition-colors focus:outline-none" aria-label="Mostrar contraseña actual">
              <i class="fas" [class.fa-eye]="!showCurrentPassword" [class.fa-eye-slash]="showCurrentPassword"></i>
            </button>
          </div>
        </div>

        <div class="border-t border-emerald-500/10 my-6"></div>

        <!-- Nueva Contraseña -->
        <div class="flex flex-col gap-2">
          <label for="newPassword" class="text-xs font-bold text-emerald-400/90 tracking-widest ml-1 uppercase">Nueva contraseña *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-lock absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
            <input id="newPassword" [type]="showNewPassword ? 'text' : 'password'" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-2xl py-3 pl-12 pr-12 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
              [(ngModel)]="form.newPassword" name="newPassword"
              placeholder="Mínimo 6 caracteres" required minlength="6" />
            <button type="button" (click)="showNewPassword = !showNewPassword" class="absolute right-4 text-slate-500 hover:text-emerald-400 transition-colors focus:outline-none" aria-label="Mostrar nueva contraseña">
              <i class="fas" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword"></i>
            </button>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="text-xs font-bold text-emerald-400/90 tracking-widest ml-1 uppercase">Confirmar nueva contraseña *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-check-double absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
            <input id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-2xl py-3 pl-12 pr-12 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
              [(ngModel)]="confirmPassword" name="confirmPassword"
              placeholder="Repita la nueva contraseña" required minlength="6" />
            <button type="button" (click)="showConfirmPassword = !showConfirmPassword" class="absolute right-4 text-slate-500 hover:text-emerald-400 transition-colors focus:outline-none" aria-label="Mostrar confirmación de contraseña">
              <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
            </button>
          </div>
        </div>

        <!-- Acciones -->
        <div class="pt-6 flex justify-end">
          <button type="submit" 
            class="btn-primary min-w-[200px]" 
            [disabled]="loading()">
            @if (loading()) {
              <i class="fas fa-spinner animate-spin text-base mr-2"></i>
              <span>Guardando...</span>
            } @else {
              <span>Cambiar Contraseña</span>
              <i class="fas fa-save ml-1.5"></i>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
