<div class="p-6 max-w-3xl mx-auto mt-4">
  <div class="mb-8">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Cambiar Contraseña</h1>
    <p class="text-slate-500 mt-2 text-sm font-medium">
      Actualiza tu contraseña de acceso al sistema regularmente por seguridad.
    </p>
  </div>

  <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden relative">
    <!-- Decorative subtle gradient -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
    
    <div class="p-8">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Contraseña Actual -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Contraseña Actual *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-unlock-alt absolute left-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
            <input type="password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none" 
              [(ngModel)]="form.currentPassword" name="currentPassword"
              placeholder="Ingrese su contraseña actual" required />
          </div>
        </div>

        <div class="border-t border-slate-100 my-6"></div>

        <!-- Nueva Contraseña -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Nueva Contraseña *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-lock absolute left-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
            <input type="password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none" 
              [(ngModel)]="form.newPassword" name="newPassword"
              placeholder="Mínimo 6 caracteres" required minlength="6" />
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Confirmar Nueva Contraseña *</label>
          <div class="relative flex items-center group">
            <i class="fas fa-check-double absolute left-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i>
            <input type="password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none" 
              [(ngModel)]="confirmPassword" name="confirmPassword"
              placeholder="Repita la nueva contraseña" required minlength="6" />
          </div>
        </div>

        <!-- Acciones -->
        <div class="pt-6 flex justify-end">
          <button type="submit" 
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-[0_4px_14px_0_rgba(79,70,229,0.39)] hover:shadow-[0_6px_20px_rgba(79,70,229,0.23)] hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2" 
            [disabled]="loading()">
            @if (loading()) {
            <svg class="animate-spin w-5 h-5 opacity-75" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
            </svg>
            <span>Guardando...</span>
            } @else {
            <span>Cambiar Contraseña</span>
            <i class="fas fa-save ml-1"></i>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
