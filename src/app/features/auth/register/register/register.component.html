<div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2rem] p-8 shadow-2xl flex flex-col relative overflow-hidden">
  <h2 class="text-2xl font-bold text-slate-100 text-center mb-6 tracking-tight">
    Crear Cuenta
  </h2>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Full Name -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Nombre Completo</label>
      <div class="relative flex items-center group">
        <i class="fas fa-id-card absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="text" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.fullName" name="fullName" placeholder="Juan Pérez" required />
      </div>
    </div>

    <!-- Username -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Usuario</label>
      <div class="relative flex items-center group">
        <i class="fas fa-user absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="text" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.username" name="username" placeholder="juanperez" required />
      </div>
    </div>

    <!-- Email -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Correo Electrónico</label>
      <div class="relative flex items-center group">
        <i class="fas fa-envelope absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="email" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.email" name="email" placeholder="juan@empresa.com" required />
      </div>
    </div>

    <!-- Password -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Contraseña</label>
      <div class="relative flex items-center group">
        <i class="fas fa-lock absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="password" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.password" name="password" placeholder="Mínimo 8 caracteres" required />
      </div>
      <p class="text-[10px] uppercase font-bold text-slate-500 mt-1 ml-1 flex items-center gap-1">
        <i class="fas fa-info-circle"></i> Debe contener mayúscula, número y carácter especial.
      </p>
    </div>

    <!-- Buttons -->
    <button type="submit" 
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-[0.98] mt-4 flex items-center justify-center gap-2"
      [disabled]="loading()">
      @if (loading()) {
      <svg class="animate-spin w-5 h-5 opacity-75" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
      </svg>
      <span>Registrando...</span>
      } @else {
      <span>Crear Cuenta</span>
      <i class="fas fa-user-plus ml-1"></i>
      }
    </button>
  </form>

  <p class="mt-8 text-center text-sm font-medium text-slate-400">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="text-indigo-400 hover:text-indigo-300 transition-colors ml-1 border-b border-indigo-400/30 hover:border-indigo-300 pb-0.5">
      Inicia sesión
    </a>
  </p>
</div>
