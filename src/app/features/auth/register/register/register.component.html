<div class="bg-white/80 backdrop-blur-md border border-[#150fbd]/10 shadow-xl shadow-[#150fbd]/5 rounded-[2.5rem] p-10 animate-scale-in relative overflow-hidden w-full">
  <h2 class="text-3xl font-black text-slate-900 text-center mb-6 tracking-tight">
    Crear Cuenta
  </h2>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Full Name -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Nombre Completo</label>
      <div class="relative flex items-center group">
        <i class="fas fa-id-card absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="text" class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.fullName" name="fullName" #fullName="ngModel" placeholder="Juan Pérez" required />
      </div>
      <div *ngIf="fullName.touched && fullName.invalid" class="text-rose-500 text-[10px] font-bold uppercase mt-1 ml-1">
        El nombre completo es obligatorio
      </div>
    </div>

    <!-- Username -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Usuario</label>
      <div class="relative flex items-center group">
        <i class="fas fa-user absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="text" class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.username" name="username" #username="ngModel" placeholder="juanperez" required minlength="3" />
      </div>
      <div *ngIf="username.touched && username.invalid" class="text-rose-500 text-[10px] font-bold uppercase mt-1 ml-1">
        El usuario es obligatorio (min. 3 caract.)
      </div>
    </div>

    <!-- Email -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Correo Electrónico</label>
      <div class="relative flex items-center group">
        <i class="fas fa-envelope absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="email" class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.email" name="email" #email="ngModel" placeholder="juan@empresa.com" required email />
      </div>
      <div *ngIf="email.touched && email.invalid" class="text-rose-500 text-[10px] font-bold uppercase mt-1 ml-1">
        Ingrese un correo electrónico válido
      </div>
    </div>

    <!-- Password -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Contraseña</label>
      <div class="relative flex items-center group">
        <i class="fas fa-lock absolute left-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
        <input type="password" class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all outline-none" 
          [(ngModel)]="form.password" name="password" #password="ngModel" placeholder="Mínimo 8 caracteres" required minlength="8" />
      </div>
      <div *ngIf="password.touched && password.invalid" class="text-rose-500 text-[10px] font-bold uppercase mt-1 ml-1">
        La contraseña requiere al menos 8 caracteres
      </div>
      <p class="text-[10px] uppercase font-bold text-slate-500 mt-1 ml-1 flex items-center gap-1">
        <i class="fas fa-info-circle"></i> Debe contener mayúscula, número y carácter especial.
      </p>
    </div>

    <!-- Buttons -->
    <button type="submit" 
      class="w-full bg-[#150fbd] hover:bg-indigo-500 text-white font-black py-5 rounded-2xl transition-all shadow-[0_15px_30px_rgba(21,15,189,0.3)] hover:shadow-[0_20px_40px_rgba(21,15,189,0.5)] active:scale-[0.97] mt-6 flex items-center justify-center gap-3 uppercase tracking-widest text-lg"
      [disabled]="loading()">
      @if (loading()) {
      <svg class="animate-spin w-6 h-6 opacity-75" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
      </svg>
      <span>Registrando...</span>
      } @else {
      <span>Crear Cuenta</span>
      <i class="fas fa-user-plus ml-1 text-xl"></i>
      }
    </button>
  </form>

  <p class="mt-8 text-center text-sm font-medium text-slate-500">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-500 transition-colors ml-1 border-b border-indigo-600/30 hover:border-indigo-500 pb-0.5 font-bold">
      Inicia sesión
    </a>
  </p>
</div>
