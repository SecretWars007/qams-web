<!-- Diseño de Registro con Pantalla Dividida (Split Screen) -->
<div class="flex flex-col lg:flex-row items-stretch justify-center gap-0 bg-white/95 backdrop-blur-xl border border-indigo-500/10 shadow-2xl shadow-indigo-500/10 rounded-[2rem] overflow-hidden w-full max-w-5xl mx-auto animate-scale-in">
  
  <!-- LADO IZQUIERDO: Branding (Marca) -->
  <div class="lg:w-[400px] bg-gradient-to-br from-indigo-600 via-[#150fbd] to-indigo-900 p-12 flex flex-col items-center justify-center text-center relative overflow-hidden">
    <!-- Decoración de fondo -->
    <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-32 -mt-32"></div>
    <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-400/20 rounded-full blur-3xl -ml-32 -mb-32"></div>
    
    <div class="relative z-10">
      <div class="inline-flex items-center justify-center w-28 h-28 bg-white rounded-[2.5rem] mb-6 shadow-2xl overflow-hidden animate-float">
        <img src="/images/logo.png" alt="QAMS logo" class="w-full h-full object-cover" />
      </div>
      <h1 class="text-4xl font-black text-white tracking-tight mb-2">QAMS</h1>
      <div class="h-1 w-12 bg-white/20 mx-auto mb-4 rounded-full"></div>
      <p class="text-indigo-100 text-xs font-bold tracking-[0.3em] leading-relaxed max-w-[200px] mx-auto">
        Quality Assurance Management System
      </p>
    </div>
  </div>

  <!-- LADO DERECHO: Formulario -->
  <div class="flex-1 p-6 lg:p-10 bg-white relative">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#150fbd] to-transparent opacity-10"></div>
    
    <header class="mb-5">
      <h2 class="text-2xl font-black text-slate-900 tracking-tight mb-1">
        Registro de Usuario
      </h2>
      <p class="text-slate-500 text-xs font-medium">Completa la información requerida</p>
    </header>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <!-- Grid Layout: 2 Columnas para Desktop con gaps elegantes -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-3">
        
        <!-- Fila 1: Nombre Completo (Ancho completo) -->
        <div class="flex flex-col gap-2 md:col-span-2">
          <label for="fullName" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Nombre completo</label>
          <div class="relative flex items-center group">
            <i class="fas fa-id-card absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="text" 
              id="fullName"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.fullName" name="fullName" placeholder="Ej: Juan Pérez" required />
          </div>
        </div>

        <!-- Fila 2: Usuario y Correo -->
        <div class="flex flex-col gap-1.5">
          <label for="username" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Usuario</label>
          <div class="relative flex items-center group">
            <i class="fas fa-user absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="text" 
              id="username"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.username" name="username" placeholder="juanperez" required />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Correo electrónico</label>
          <div class="relative flex items-center group">
            <i class="fas fa-envelope absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="email" 
              id="email"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.email" name="email" placeholder="juan@empresa.com" required />
          </div>
        </div>

        <!-- Fila 3: Documento e Identidad -->
        <div class="flex flex-col gap-1.5">
          <label for="documentoIdentidad" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Documento identidad</label>
          <div class="relative flex items-center group">
            <i class="fas fa-passport absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="text" 
              id="documentoIdentidad"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.documentoIdentidad" name="documentoIdentidad" placeholder="Ej: 12345678" required />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="telefono" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Teléfono</label>
          <div class="relative flex items-center group">
            <i class="fas fa-phone absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="tel" 
              id="telefono"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.telefono" name="telefono" placeholder="Ej: +591 70000000" />
          </div>
        </div>

        <!-- Fila 4: Fecha de Nacimiento y Contraseña -->
        <div class="flex flex-col gap-1.5">
          <label for="fechaNacimiento" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Fecha de nacimiento</label>
          <div class="relative flex items-center group">
            <i class="fas fa-calendar absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="date" 
              id="fechaNacimiento"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.fechaNacimiento" name="fechaNacimiento" [min]="minDate" [max]="maxDate" required />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-[10px] font-black text-slate-400 tracking-widest ml-1">Contraseña</label>
          <div class="relative flex items-center group">
            <i class="fas fa-lock absolute left-4 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
            <input type="password" 
              id="password"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-12 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all outline-none" 
              [(ngModel)]="form.password" name="password" placeholder="Mínimo 8 caracteres" required />
          </div>
        </div>
      </div>

      <!-- Botón de Registro Mejorado -->
      <button type="submit" 
        class="w-full bg-[#150fbd] hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition-all shadow-xl shadow-indigo-500/20 active:scale-[0.98] mt-2 flex items-center justify-center gap-3 tracking-widest text-sm group"
        [disabled]="loading()">
        @if (loading()) {
          <i class="fas fa-spinner animate-spin"></i>
          <span>Creando cuenta...</span>
        } @else {
          <span>Finalizar registro</span>
          <i class="fas fa-arrow-right text-base transition-transform group-hover:translate-x-1"></i>
        }
      </button>

      <!-- Footer del Formulario -->
      <div class="pt-3 border-t border-slate-100 mt-1 text-center">
        <p class="text-[11px] font-bold text-slate-500 tracking-tighter">
          ¿Ya tienes cuenta?
          <a routerLink="/auth/login" class="text-indigo-600 hover:text-indigo-700 transition-colors ml-1 font-black underline underline-offset-4 decoration-2">
            Inicia sesión
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
