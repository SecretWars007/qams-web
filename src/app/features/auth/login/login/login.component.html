<div class="card">
  <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">
    Iniciar Sesión
  </h2>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Username -->
    <div>
      <label class="form-label">Usuario</label>
      <input type="text" class="form-input" [(ngModel)]="form.username" name="username" placeholder="Ingrese su usuario"
        required autofocus />
    </div>

    <!-- Password -->
    <div>
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-input" [(ngModel)]="form.password" name="password"
        placeholder="Ingrese su contraseña" required />
    </div>

    <!-- Botón Login -->
    <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2" [disabled]="loading()">
      @if (loading()) {
      <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
      </svg>
      Ingresando...
      } @else {
      Iniciar Sesión
      }
    </button>
  </form>

  <!-- Link a registro -->
  <p class="mt-4 text-center text-sm text-gray-600">
    ¿No tienes cuenta?
    <a routerLink="/auth/register" class="text-primary-600 hover:text-primary-700 font-medium">
      Regístrate aquí
    </a>
  </p>
</div>
