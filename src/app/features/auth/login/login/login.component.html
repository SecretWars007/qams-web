<div class="login-glass-card animate-scale-in">
  <div class="login-header">
    <h2>¡Qué bueno verte!</h2>
    <p>Accede al panel de control de QAMS</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="login-form">
    <!-- Username Field -->
    <div class="input-group">
      <label for="username">Usuario</label>
      <div class="input-container" [class.focused]="isFieldFocused('username')">
        <i class="ri-user-6-line input-icon"></i>
        <input 
          type="text" 
          id="username"
          [(ngModel)]="form.username" 
          name="username" 
          placeholder="Tu nombre de usuario"
          (focus)="setFieldFocus('username', true)"
          (blur)="setFieldFocus('username', false)"
          required 
          autofocus />
      </div>
    </div>

    <!-- Password Field -->
    <div class="input-group">
      <div class="label-row">
        <label for="password">Contraseña</label>
        <a routerLink="/auth/forgot-password" class="forgot-link">¿Olvido su contraseña?</a>
      </div>
      <div class="input-container" [class.focused]="isFieldFocused('password')">
        <i class="ri-lock-2-line input-icon"></i>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="form.password" 
          name="password" 
          placeholder="••••••••••••"
          (focus)="setFieldFocus('password', true)"
          (blur)="setFieldFocus('password', false)"
          required />
      </div>
    </div>

    <button type="submit" class="login-btn" [disabled]="loading()">
      <span *ngIf="!loading()">Entrar al Sistema</span>
      <span *ngIf="loading()" class="loader-dots">
        <span></span><span></span><span></span>
      </span>
      <i *ngIf="!loading()" class="ri-arrow-right-line btn-icon"></i>
    </button>
  </form>

  <div class="login-footer">
    <span>¿Aún no tienes cuenta?</span>
    <a routerLink="/auth/register" class="register-link">Regístrate ahora</a>
  </div>

  <!-- Decorative blur spot inside card -->
  <div class="card-blur-spot"></div>
</div>
