<div class="bg-[#111E30] border border-emerald-500/20 rounded-[2rem] p-8 shadow-2xl shadow-black/60 flex flex-col relative overflow-hidden text-slate-100 max-w-md mx-auto">
  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-40"></div>

  <h2 class="text-2xl lg:text-3xl font-black text-slate-100 text-center mb-6 tracking-tight">
    Restablecer Contraseña
  </h2>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email -->
    <div class="flex flex-col gap-1.5">
      <label for="resetEmail" class="text-[11px] font-black text-emerald-400/90 tracking-widest ml-1 uppercase">Correo electrónico</label>
      <div class="relative flex items-center group">
        <i class="fas fa-envelope absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
        <input id="resetEmail" type="email" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
          [(ngModel)]="form.email" name="email" #email="ngModel" placeholder="ejemplo@correo.com"
          required email />
      </div>
      <div *ngIf="email.touched && email.invalid" class="text-rose-400 text-[10px] font-bold mt-1 ml-1">
        Ingrese un correo válido
      </div>
    </div>

    <!-- Token -->
    <div class="flex flex-col gap-1.5">
      <label for="resetToken" class="text-[11px] font-black text-emerald-400/90 tracking-widest ml-1 uppercase">Token de recuperación</label>
      <div class="relative flex items-center group">
        <i class="fas fa-key absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
        <input id="resetToken" type="text" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm font-mono" 
          [(ngModel)]="form.resetToken" name="resetToken" #resetToken="ngModel"
          placeholder="Ingrese el token recibido" required />
      </div>
      <div *ngIf="resetToken.touched && resetToken.invalid" class="text-rose-400 text-[10px] font-bold mt-1 ml-1">
        El token es obligatorio
      </div>
    </div>

    <!-- Nueva Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="resetNewPassword" class="text-[11px] font-black text-emerald-400/90 tracking-widest ml-1 uppercase">Nueva contraseña</label>
      <div class="relative flex items-center group">
        <i class="fas fa-lock absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
        <input id="resetNewPassword" type="password" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
          [(ngModel)]="form.newPassword" name="newPassword" #newPassword="ngModel"
          placeholder="Mínimo 6 caracteres" required minlength="6" />
      </div>
      <div *ngIf="newPassword.touched && newPassword.invalid" class="text-rose-400 text-[10px] font-bold mt-1 ml-1">
        Mínimo 6 caracteres
      </div>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="flex flex-col gap-1.5">
      <label for="resetConfirmPassword" class="text-[11px] font-black text-emerald-400/90 tracking-widest ml-1 uppercase">Confirmar contraseña</label>
      <div class="relative flex items-center group">
        <i class="fas fa-lock absolute left-4 text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
        <input id="resetConfirmPassword" type="password" class="w-full bg-slate-900/80 border border-emerald-500/20 rounded-xl py-3 pl-12 pr-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition-all outline-none text-sm" 
          [(ngModel)]="confirmPassword" name="confirmPassword" #cPassword="ngModel"
          placeholder="Repita la nueva contraseña" required minlength="6" />
      </div>
      <div *ngIf="cPassword.touched && cPassword.invalid" class="text-rose-400 text-[10px] font-bold mt-1 ml-1">
        Debe confirmar la contraseña
      </div>
    </div>

    <!-- Botón Restablecer -->
    <button type="submit" 
      class="w-full bg-gradient-to-r from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.98] mt-4 flex items-center justify-center gap-2 text-sm" 
      [disabled]="loading()">
      @if (loading()) {
        <i class="fas fa-spinner animate-spin text-base"></i>
        <span>Restableciendo...</span>
      } @else {
        <span>Restablecer contraseña</span>
        <i class="fas fa-check-circle ml-1"></i>
      }
    </button>
  </form>

  <p class="mt-6 text-center text-xs font-medium text-slate-400">
    <a routerLink="/auth/login" class="text-emerald-400 hover:text-emerald-300 transition-colors font-bold">
      Volver al inicio de sesión
    </a>
  </p>
</div>
