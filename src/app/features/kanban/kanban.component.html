<div class="flex flex-col h-full bg-[#121212] rounded-3xl border border-gray-800/40 overflow-hidden shadow-2xl animate-in fade-in zoom-in-95 duration-500">
  <!-- Dynamic Dashboard Header -->
  <div class="px-8 py-6 bg-gradient-to-r from-gray-900 to-gray-800 border-b border-gray-700/50 flex justify-between items-center sm:flex-row flex-col gap-4">
    <div class="flex items-center gap-4">
      <div class="p-3 bg-blue-500/10 rounded-2xl border border-blue-500/20 text-blue-400">
        <i class="ri-kanban-view text-2xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white leading-tight">Flujo de trabajo</h2>
        <p class="text-xs text-gray-400 font-medium tracking-wide">Kanban de seguimiento de tareas</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <div class="flex -space-x-2 mr-4 overflow-hidden">
        <div *ngFor="let user of [1,2,3,4]" 
             class="inline-block h-8 w-8 rounded-full ring-2 ring-gray-800 bg-gray-700 flex items-center justify-center text-[10px] font-bold text-white border border-white/10">
          U{{user}}
        </div>
      </div>
      <button class="btn-primary flex items-center gap-2 py-2.5 px-5 text-sm rounded-xl transition-all hover:scale-[1.02]">
        <i class="ri-add-line"></i>
        <span>Nueva tarea</span>
      </button>
    </div>
  </div>

  <!-- Kanban Board Background -->
  <div class="flex-1 overflow-x-auto p-8 bg-[#0a0a0a] custom-scrollbar" cdkDropListGroup>
    <div class="flex gap-8 min-w-max h-full">
      
      <!-- Columns -->
      <div *ngFor="let column of board()?.columns" 
        class="flex flex-col w-80 bg-gray-900/40 rounded-3xl border border-gray-800/30 backdrop-blur-md shadow-lg transition-all hover:bg-gray-900/60 overflow-hidden">
        
        <!-- Column Header -->
        <div class="p-5 flex justify-between items-center border-b border-gray-800/50">
          <div class="flex items-center gap-3">
            <div [ngClass]="{
              'bg-amber-500/10 text-amber-500': column.id === 'PENDING',
              'bg-blue-500/10 text-blue-500': column.id === 'IN_PROGRESS',
              'bg-emerald-500/10 text-emerald-500': column.id === 'COMPLETED',
              'bg-slate-500/10 text-slate-400': column.id === 'SKIPPED'
            }" class="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(0,0,0,0.5)]"></div>
            <h3 class="text-sm font-bold text-gray-200 tracking-tight">{{ column.name }}</h3>
          </div>
          <span class="bg-gray-800/80 text-gray-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-gray-700/50">{{ column.tasks.length }}</span>
        </div>

        <!-- Task List Area -->
        <div cdkDropList [cdkDropListData]="column.tasks" (cdkDropListDropped)="drop($event)"
          class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar min-h-[200px]">

          <!-- Task Card -->
          <button *ngFor="let task of column.tasks" cdkDrag (click)="openExecution(task)" (keydown.enter)="openExecution(task)"
            class="w-full text-left bg-gray-800/40 p-5 rounded-2xl border border-gray-700/30 hover:border-blue-500/50 cursor-pointer shadow-md transition-all group relative hover:translate-y-[-2px] hover:bg-gray-800/60 active:scale-[0.98]">

            <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-all transform scale-90 group-hover:scale-100">
              <div class="p-1.5 bg-gray-700/50 rounded-lg text-blue-400 hover:text-blue-300">
                <i class="ri-external-link-line"></i>
              </div>
            </div>

            <div class="flex justify-between items-start mb-4">
              <span [ngClass]="{
                'bg-red-500/10 text-red-500 border-red-500/20': task.priorityCode === 'P0' || task.priorityCode === 'P1',
                'bg-amber-500/10 text-amber-500 border-amber-500/20': task.priorityCode === 'P2',
                'bg-blue-500/10 text-blue-400 border-blue-500/20': task.priorityCode === 'P3'
              }" class="text-[10px] font-bold px-2 py-0.5 rounded-lg border tracking-wider">
                {{ task.priorityName }}
              </span>
              <span class="text-gray-500 hover:text-white opacity-0 group-hover:opacity-100 cursor-pointer transition-colors p-1">
                <i class="ri-more-2-fill"></i>
              </span>
            </div>

            <h4 class="text-white font-bold text-sm mb-4 leading-snug tracking-tight line-clamp-2 group-hover:text-blue-200 transition-colors">{{ task.title }}</h4>

            <div class="flex justify-between items-center text-[11px] text-gray-500 mt-4 pt-4 border-t border-gray-700/40">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-black text-[9px] shadow-lg shadow-blue-900/20">
                  {{ task.assigneeName?.charAt(0) }}
                </div>
                <span class="font-medium text-gray-400">{{ task.assigneeName }}</span>
              </div>
              <div class="flex items-center gap-1.5 font-bold">
                <i class="ri-calendar-event-line text-gray-600"></i>
                <span [ngClass]="{'text-red-400': task.dueDate && task.priorityCode === 'P0'}">{{ task.dueDate | date:'dd MMM' }}</span>
              </div>
            </div>
          </button>
        </div>

        <!-- Column Footer Action -->
        <div class="p-4 bg-gray-900/20 border-t border-gray-800/30">
          <button class="w-full py-2.5 px-4 bg-transparent border border-gray-700/50 border-dashed rounded-xl text-xs font-bold text-gray-500 hover:text-gray-300 hover:border-gray-600 hover:bg-white/[0.02] transition-all flex items-center justify-center gap-2">
            <i class="ri-add-line text-sm"></i>
            <span>Añadir tarea</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
