<!-- Layout de pantalla completa para login/register -->
<div class="min-h-screen relative flex items-center justify-center p-4 bg-[#F6F6F8] overflow-y-auto overflow-x-hidden">
  
  <!-- Background Pattern Layer (Forced Visibility - Synchronized) -->
  <div 
    class="absolute inset-0 opacity-[0.25] pointer-events-none transition-opacity duration-700 auth-bg-pattern"
  ></div>

  <!-- Abstract Background Details -->
  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-600/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-indigo-900/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

  <!-- Contenedor central (Los hijos controlarán su propio branding) -->
  <div class="w-full max-w-5xl z-10 relative py-4 flex flex-col items-center">
    <!-- Contenido dinámico (login o register ahora incluyen su logo) -->
    <router-outlet></router-outlet>
  </div>
</div>
