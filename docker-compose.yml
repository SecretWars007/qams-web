version: '3.8'

services:
  qams-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    container_name: qams-web
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
