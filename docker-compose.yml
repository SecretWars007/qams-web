services:
  qams-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qams-web:latest
    container_name: qams-web
    ports:
      - "4200:80"
    restart: unless-stopped
    networks:
      - qams-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  qams-network:
    external: true
    name: qams-network
