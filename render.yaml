services:
  # Frontend SPA Angular 19 (Static Site en Render Edge CDN)
  - type: web
    name: qams-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/qams-web/browser
    autoDeploy: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Enrutamiento SPA para Angular: redirige todas las rutas a index.html
      - type: rewrite
        source: /*
        destination: /index.html
